<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live spectrogram</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local microphone analyzer</p>
          <h1>Live spectrogram</h1>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Idle</span>
        </div>
      </header>

      <section class="controls" aria-label="Controls">
        <button class="primary" id="startButton" type="button">Start mic</button>
        <button id="stopButton" type="button" disabled>Stop</button>
        <button id="resetButton" type="button">Reset</button>

        <label class="control-field">
          <span>FFT</span>
          <select id="fftSizeSelect">
            <option value="512">512</option>
            <option value="1024">1024</option>
            <option value="2048">2048</option>
            <option value="4096" selected>4096</option>
            <option value="8192">8192</option>
            <option value="16384">16384</option>
          </select>
        </label>

        <label class="control-field">
          <span>Window</span>
          <select id="windowFunctionSelect">
            <option value="rectangular">Rectangular</option>
            <option value="hann">Hann</option>
            <option value="hamming" selected>Hamming</option>
            <option value="kaiser">Kaiser (β=8.6)</option>
            <option value="blackman">Blackman</option>
          </select>
        </label>

        <label class="control-field">
          <span>Range</span>
          <select id="frequencyRangeSelect">
            <option value="1000">0-1 kHz</option>
            <option value="2000">0-2 kHz</option>
            <option value="4000" selected>0-4 kHz</option>
            <option value="8000">0-8 kHz</option>
            <option value="12000">0-12 kHz</option>
            <option value="16000">0-16 kHz</option>
            <option value="20000">0-20 kHz</option>
          </select>
        </label>

        <label class="control-field wide" title="Input gain applied to the waveform, spectrogram, and input level. 0 dB leaves the signal unchanged.">
          <span>Gain</span>
          <input id="inputGainSlider" type="range" min="-30" max="40" value="0" step="1" aria-label="Input gain" aria-valuetext="0 dB" />
          <strong id="inputGainValue">0 dB</strong>
        </label>

        <label class="control-field wide" title="dB floor for the power spectrogram">
          <span>Floor</span>
          <input id="dbFloorSlider" type="range" min="-120" max="-45" value="-95" step="1" />
          <strong id="dbFloorValue">-95 dB</strong>
        </label>
      </section>

      <section class="meter-row" aria-label="Input meters">
        <div class="meter-card">
          <span class="metric-label">Input level</span>
          <div class="meter-track">
            <div class="meter-fill" id="levelMeter"></div>
          </div>
          <strong id="levelValue">-inf dBFS</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">Time</span>
          <strong id="timeValue">00:00.0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">Peak</span>
          <strong id="peakValue">-- Hz</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">Sample rate</span>
          <strong id="sampleRateValue">--</strong>
        </div>
      </section>

      <section class="visual-stack">
        <article class="visual-panel waveform-panel">
          <div class="panel-head">
            <h2>Waveform</h2>
            <span>12-second timeline</span>
          </div>
          <div class="waveform-layout">
            <div class="amplitude-axis" aria-hidden="true">
              <span>+1</span>
              <span>0</span>
              <span>-1</span>
            </div>
            <div class="canvas-frame waveform-frame">
              <canvas id="waveformCanvas" aria-label="Live waveform"></canvas>
            </div>
          </div>
        </article>

        <article class="visual-panel spectrogram-panel">
          <div class="panel-head spectrogram-head">
            <div class="spectrogram-heading">
              <h2 id="spectrogramTitle">Power spectrogram</h2>
              <label class="control-field">
                <span>Display</span>
                <select id="spectrogramModeSelect">
                  <option value="power" selected>Power</option>
                  <option value="phase">Phase</option>
                </select>
              </label>
            </div>
            <span id="spectrogramCaption">Hamming, 4096 FFT, 0-4 kHz</span>
          </div>
          <div class="spectrogram-scale">
            <span id="colorScaleLabel">Power (dB)</span>
            <div class="color-scale">
              <canvas id="colorScaleCanvas" width="256" height="12" role="img" aria-label="Power color scale"></canvas>
              <div id="colorScaleTicks" class="color-scale-ticks">
                <span>-95</span><span>-71.3</span><span>-47.5</span><span>-23.8</span><span>0</span>
              </div>
            </div>
          </div>
          <div class="spectrogram-layout">
            <div class="frequency-axis" aria-hidden="true">
              <span id="axisTop">4 kHz</span>
              <span id="axisMid">2 kHz</span>
              <span>0</span>
            </div>
            <div class="canvas-frame spectrogram-frame">
              <canvas id="spectrogramCanvas" aria-label="Live power spectrogram"></canvas>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
